version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.17.0

jobs:
  setup:
    executor: node-executor
    steps:
      - checkout
      - run: npm ci
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - package-lock.json
            - package.json
            - tsconfig.json
  prettier:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: npm run format:check
  build:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist
  test:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: npm test
  release:
    executor: node-executor
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - 'SHA256:URk6UqM1/e3vroCOb5tGrcchx8EJFhRhRn+Yw0gX8E0'
      - attach_workspace:
          at: .
      - run:
          name: Configure Git for SSH
          command: |
            git config user.email "ci@skier.dev"
            git config user.name "CircleCI"
            # Point the release remote at the canonical repository. CI runs on
            # Ripixel-Studio/skier; the old ripixel/skier path is a stale personal
            # remote. semantic-release has no `repository` field in package.json,
            # so it derives its git-tag push target AND the @semantic-release/github
            # release/permission-check target from this remote — it must match the
            # repo CI actually operates on.
            git remote set-url origin git@github.com:Ripixel-Studio/skier.git
      - run:
          name: Upgrade npm to a version with OIDC trusted-publishing support
          command: |
            # The npm CLI performs the NPM_ID_TOKEN -> short-lived-publish-token
            # exchange itself, but only from v11.5.1 onward. The cimg/node:22.17.0
            # executor ships an older bundled npm, so upgrade before publishing.
            sudo npm install -g npm@latest
            npm --version
      - run:
          name: Publish via semantic-release (npm OIDC trusted publishing)
          command: |
            # Publishing is split in two:
            #
            #   1. @semantic-release/npm runs with `npmPublish: false` (see .releaserc).
            #      It still bumps package.json to the released version during its
            #      prepare step, but does NOT publish and does NOT require NPM_TOKEN.
            #   2. @semantic-release/exec runs the actual `npm publish` during the
            #      publish phase — which only happens on a real release — after
            #      minting a short-lived OIDC token scoped to the npm registry:
            #        NPM_ID_TOKEN=$(circleci run oidc get \
            #          --claims '{"aud": "npm:registry.npmjs.org"}')
            #      The modern npm CLI exchanges that token for a publish token
            #      automatically. exec provides ${nextRelease.channel} so the dist-tag
            #      matches the release channel (latest for main).
            #
            # Why not @semantic-release/npm's own OIDC path: as of v13.1 its token
            # exchange only fires when env-ci reports "GitHub Actions" or "GitLab
            # CI/CD" (lib/trusted-publishing/token-exchange.js). On CircleCI env-ci
            # reports "CircleCI", so that path is skipped — hence the exec workaround.
            #
            # NPM_TOKEN is no longer used by this job and can be removed from the
            # CircleCI project settings once a release has succeeded over OIDC.
            npx semantic-release
  build_docs:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: npm run docs:build
      - persist_to_workspace:
          root: .
          paths:
            - public
  deploy_docs_prod:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: ./node_modules/.bin/firebase deploy --only hosting:production --token "$FIREBASE_TOKEN"

  deploy_docs_staging:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: ./node_modules/.bin/firebase deploy --only hosting:staging --token "$FIREBASE_TOKEN"
      - run:
          name: Post Github PR Comment
          command: |
            sudo apt-get install -y jq
            channels=$(./node_modules/.bin/firebase hosting:channel:list)
            circle_branch_replaced=$(echo "$CIRCLE_BRANCH" | sed "s/\//-/")
            regex='(https:\/\/[a-z0-9-]*--'"${circle_branch_replaced:0:39}"'-[a-z0-9-]*.web.app)'
            url=""
            [[ $channels =~ $regex ]] && url=${BASH_REMATCH[0]}
            if [ -z "$url" ]; then
              url="Unable to get URL - check Firebase console"
            fi
            pr_response=$(curl --silent --location --request GET "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open" \
            -u "$GH_USER:$GH_COMMENTS_TOKEN")
            pr_comment_url=$(echo "${pr_response:-null}" | jq -r 'if type=="array" and length>0 then .[0]._links.comments.href else empty end' 2>/dev/null || true)
            if [ -z "$pr_comment_url" ]; then
              echo "No PR found to update"
            else
              curl --silent --location --request POST "$pr_comment_url" \
              -u "$GH_USER:$GH_COMMENTS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-raw '{"body": "Successfully deployed to Firebase staging preview! Available at: '"$url"'"}'
            fi

  deploy_docs_preview:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: ./node_modules/.bin/firebase hosting:channel:deploy $CIRCLE_BRANCH --token "$FIREBASE_TOKEN"
      - run:
          name: Post Github PR Comment
          command: |
            sudo apt-get install -y jq
            channels=$(./node_modules/.bin/firebase hosting:channel:list)
            circle_branch_replaced=$(echo "$CIRCLE_BRANCH" | sed "s/\//-/")
            regex='(https:\/\/[a-z0-9-]*--'"${circle_branch_replaced:0:39}"'-[a-z0-9-]*.web.app)'
            url=""
            [[ $channels =~ $regex ]] && url=${BASH_REMATCH[0]}
            if [ -z "$url" ]; then
              url="Unable to get URL - check Firebase console"
            fi
            pr_response=$(curl --silent --location --request GET "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open" \
            -u "$GH_USER:$GH_COMMENTS_TOKEN")
            pr_comment_url=$(echo "${pr_response:-null}" | jq -r 'if type=="array" and length>0 then .[0]._links.comments.href else empty end' 2>/dev/null || true)
            if [ -z "$pr_comment_url" ]; then
              echo "No PR found to update"
            else
              curl --silent --location --request POST "$pr_comment_url" \
              -u "$GH_USER:$GH_COMMENTS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-raw '{"body": "Successfully deployed to Firebase preview! Available at: '"$url"'"}'
            fi

workflows:
  version: 2
  build-and-release:
    jobs:
      - setup
      - prettier:
          requires:
            - setup
      - build:
          requires:
            - setup
      - build_docs:
          requires:
            - build
      - test:
          requires:
            - setup
      - release:
          requires:
            - prettier
            - build
            - test
      - deploy_docs_prod:
          filters:
            branches:
              only: main
          requires:
            - release
            - build_docs
      - deploy_docs_staging:
          filters:
            branches:
              only: staging
          requires:
            - release
            - build_docs
      - deploy_docs_preview:
          filters:
            branches:
              ignore:
                - main
                - staging
          requires:
            - release
            - build_docs
